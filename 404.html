<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=https://yukicord.github.io/Yukicord/app" />
    <script>
      const baseUrl = window.location.origin;
      const fullPath = window.location.pathname + window.location.search + window.location.hash;
      if (window.location.href.startsWith(baseUrl + '/') && !window.location.href.includes('/Yukicord/app')) {
        const target = baseUrl + '/Yukicord/app?page=' + encodeURIComponent(fullPath);
        window.location.replace(target);
      }
    </script>
  </head>
  <body></body>
</html>
